# Describes the format for available component services
process:
  fields:
    text:
      example: Turn all lights on
      required: true
      selector:
        text:
    language:
      example: NL
      selector:
        text:
    agent_id:
      example: homeassistant
      selector:
        conversation_agent:
    conversation_id:
      example: my_conversation_1
      selector:
        text:
    structure:
      advanced: true
      filter:
        supported_features:
          - conversation.ConversationEntityFeature.STRUCTURED_OUTPUT
      example: '{ "name": { "selector": { "text": }, "description": "Age of the user" } } }, "age": { "selector": { "number": }, "description": "Age of the user" } }'
      selector:
        object:

